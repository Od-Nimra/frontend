<div class="max-w-2xl mx-auto p-4 md:p-6 font-[Poppins,sans-serif] text-white">

  <!-- Profile Card -->
  <div class="bg-[#0a1221]/80 backdrop-blur-xl border border-[#0082FB]/30 shadow-[0_0_15px_#0082FB44] rounded-2xl p-6 sm:p-8 space-y-8 transition-all duration-300 ease-in-out hover:shadow-[0_0_25px_#0082FB66]">

    <!-- Avatar + Name -->
    <div class="flex flex-col items-center space-y-3">
      <div class="relative group transition-transform duration-300 hover:scale-105">
      <div class="w-28 h-28 rounded-full border-4 border-[#0082FB] shadow-lg flex items-center justify-center text-4xl font-bold text-[#00bfff] bg-[#0a1221] relative overflow-hidden">
  <img
    [src]="user.avatar"
    alt="Avatar"
    class="absolute inset-0 w-full h-full object-cover"
    (error)="user.avatar = ''"
    *ngIf="user.avatar"
  />
  <span *ngIf="!user.avatar">{{ avatarInitial }}</span>
</div>

        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-[#00fffc] rounded-full blur-sm opacity-60 group-hover:scale-150 group-hover:opacity-30 transition-all"></div>
      </div>
      <h2 class="text-xl sm:text-2xl font-bold text-[#66b3ff] tracking-wide">{{ user.name }}</h2>
    </div>

    <!-- Info -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm text-[#ccc]">
      <div class="group">
        <label class="block text-xs text-[#999] mb-1">📧 Email</label>
        <div class="bg-[#001728] border border-[#0082FB]/30 rounded px-3 py-2 transition duration-300 group-hover:border-[#00cfff] group-hover:bg-[#001c33]">{{ user.email }}</div>
      </div>
      <div class="group">
        <label class="block text-xs text-[#999] mb-1">🎓 Department</label>
        <div class="bg-[#001728] border border-[#0082FB]/30 rounded px-3 py-2 transition duration-300 group-hover:border-[#00cfff] group-hover:bg-[#001c33]">{{ user.department }}</div>
      </div>
      <div class="group">
        <label class="block text-xs text-[#999] mb-1">📚 Semester</label>
        <div class="bg-[#001728] border border-[#0082FB]/30 rounded px-3 py-2 transition duration-300 group-hover:border-[#00cfff] group-hover:bg-[#001c33]">{{ user.semester }}</div>
      </div>
    </div>

    <!-- Optional: Shortcuts -->
    <div class="flex justify-center gap-4 pt-4 text-sm">
      <a routerLink="/calendar" class="bg-[#001f3f] text-[#66b3ff] px-4 py-2 rounded-full border border-[#0082FB]/30 hover:bg-[#002b56] transition">📅 View Calendar</a>
      <a routerLink="/absence" class="bg-[#001f3f] text-[#66b3ff] px-4 py-2 rounded-full border border-[#0082FB]/30 hover:bg-[#002b56] transition">📄 My Applications</a>
    </div>

    <!-- Logout -->
    <div class="pt-6 border-t border-[#0082FB]/10 text-center">
      <button (click)="openLogoutModal()" class="text-red-400 hover:text-red-500 text-sm transition">🚪 Logout</button>
    </div>
  </div>
</div>

<!-- Logout Modal -->
<div *ngIf="showLogoutModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
  <div class="bg-[#0a1221] border border-[#0082FB]/30 rounded-xl p-6 w-full max-w-sm shadow-xl text-white space-y-4">
    <h3 class="text-lg font-semibold text-[#66b3ff]">Confirm Logout</h3>
    <p class="text-sm text-[#aaa]">Are you sure you want to logout?</p>
    <div class="flex justify-end gap-3 pt-2">
      <button (click)="cancelLogout()" class="px-4 py-2 rounded bg-[#001728] border border-[#0082FB]/30 hover:bg-[#002544] transition">Cancel</button>
      <button (click)="confirmLogout()" class="px-4 py-2 rounded bg-red-500 text-white hover:bg-red-600 transition">Logout</button>
    </div>
  </div>
</div>
