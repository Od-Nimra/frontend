<div class="bg-[#000103] text-white min-h-screen px-4 py-8 font-[Poppins,sans-serif] max-w-6xl mx-auto space-y-8">

  <!-- 🔍 Filters -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    
    <!-- 🎓 Department Filter -->
    <div>
      <label class="block text-sm font-medium text-[#50bfff] mb-1">🎓 Department</label>
      <select
        [(ngModel)]="selectedCategory"
        (change)="filterEvents()"
        class="w-full bg-[#0d1117] border border-[#50bfff]/40 text-white rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#50bfff] transition-shadow hover:shadow-[0_0_10px_#50bfff]/30"
      >
        <option value="all">All Departments</option>
        <option *ngFor="let cat of categories" [value]="cat.value">{{ cat.name }}</option>
      </select>
    </div>

    <!-- 🔍 Search Box -->
    <div class="sm:col-span-2">
      <label class="block text-sm font-medium text-[#50bfff] mb-1">🔎 Search Events</label>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="filterEvents()"
        placeholder="Search by title or description"
        class="w-full bg-[#0d1117] border border-[#50bfff]/40 text-white rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#50bfff] transition-shadow hover:shadow-[0_0_10px_#50bfff]/30"
      />
    </div>
  </div>

  <!-- 🎉 Event Cards -->
  <div class="grid grid-cols-1 gap-6">
    <div
      *ngFor="let event of paginatedEvents"
      [ngClass]="{ 'opacity-100': canRegister(event.department), 'opacity-40': !canRegister(event.department) }"
      class="bg-[#0c1628] border border-[#50bfff]/30 rounded-2xl shadow-lg hover:shadow-[0_0_20px_#50bfff] overflow-hidden flex flex-col md:flex-row transition-transform duration-200 hover:scale-[1.01] backdrop-blur-md"
    >
      <!-- 📷 Image -->
      <div class="w-full md:w-1/3 h-48 md:h-auto">
        <img [src]="event.image || 'assets/card1 (1).jpg'" alt="Event Image" class="w-full h-full object-cover" />
      </div>

      <!-- 📄 Content -->
      <div class="w-full md:w-2/3 p-4 flex flex-col justify-between space-y-3">
        <div>
          <h2 class="text-lg font-bold text-white">{{ event.title }}</h2>
          <p class="text-sm text-[#c2e9ff] mt-1">{{ event.desc }}</p>

          <!-- 🏷️ Tags -->
          <div class="flex flex-wrap gap-2 mt-3 text-sm">
            <span class="flex items-center gap-1 bg-[#50bfff]/10 text-[#50bfff] px-3 py-1 rounded-full text-xs">
              <img src="assets/map-pin.png" alt="Location" class="w-4 h-4" />
              {{ event.location }}
            </span>

            <span class="flex items-center gap-1 bg-[#50bfff]/10 text-[#50bfff] px-3 py-1 rounded-full text-xs">
              <img src="assets/calendar-fold.png" alt="Date" class="w-4 h-4" />
              {{ event.date }}
            </span>

            <span class="flex items-center gap-1 bg-[#50bfff]/10 text-[#50bfff] px-3 py-1 rounded-full text-xs">
              <img src="assets/clock-3.png" alt="Time" class="w-4 h-4" />
              {{ event.time }}
            </span>

            <span class="bg-[#50bfff]/10 text-[#50bfff] px-3 py-1 rounded-full text-[11px] font-medium">
              {{ event.department | titlecase }} Dept
            </span>
          </div>
        </div>

        <!-- 👣 Actions -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <a
            [routerLink]="'/events/' + event.id"
            class="inline-block text-sm px-4 py-2 bg-[#50bfff] text-black rounded hover:bg-[#73d3ff] transition shadow hover:shadow-[0_0_12px_#50bfff]"
          >
            🔍 View Details
          </a>

          <ng-container *ngIf="!canRegister(event.department)">
            <span class="text-red-400 text-xs italic">You can't register for this event.</span>
          </ng-container>
        </div>
      </div>
    </div>
  </div>

  <!-- 🚫 No Results -->
  <div *ngIf="filteredEvents.length === 0" class="text-center text-[#50bfff] py-8 italic">
    No events match your filters 😔
  </div>

  <!-- 📄 Pagination -->
  <div class="flex justify-center items-center gap-4 mt-6 text-sm">
    <button
      (click)="prevPage()"
      [disabled]="currentPage === 1"
      class="px-4 py-2 bg-[#0d1117] border border-[#50bfff]/30 rounded hover:bg-[#0f1a2b] disabled:opacity-40"
    >
      ⬅️ Prev
    </button>

    <span class="text-[#50bfff]">Page {{ currentPage }} of {{ totalPages }}</span>

    <button
      (click)="nextPage()"
      [disabled]="currentPage === totalPages"
      class="px-4 py-2 bg-[#0d1117] border border-[#50bfff]/30 rounded hover:bg-[#0f1a2b] disabled:opacity-40"
    >
      Next ➡️
    </button>
  </div>
</div>
