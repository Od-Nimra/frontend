<div class="max-w-md sm:max-w-4xl mx-auto p-4 font-[Poppins,sans-serif] text-[12px] text-white">

  <!-- 🔹 Month Navigation + Today -->
<div class="flex justify-between items-center mb-4">
  <button (click)="prevMonth()" class="bg-[#00152e] text-[#0082FB] px-3 py-1 rounded shadow hover:bg-[#002446] transition">←</button>
  
  <div class="text-center">
    <h2 class="font-bold text-[#66b3ff] text-sm sm:text-base">
      {{ months[currentMonth] }} {{ currentYear }}
    </h2>
    <button (click)="goToToday()" class="text-xs text-[#aaa] hover:text-[#0082FB] underline mt-1">Today</button>
  </div>
  
  <button (click)="nextMonth()" class="bg-[#00152e] text-[#0082FB] px-3 py-1 rounded shadow hover:bg-[#002446] transition">→</button>
</div>

  <!-- 🔹 Day Labels -->
  <div class="grid grid-cols-7 text-center uppercase tracking-wider font-semibold text-[#ccc] text-[10px] sm:text-[11px] bg-[#001728] border border-[#0082FB]/20 rounded-t-md">
    <div *ngFor="let day of dayNames" class="py-2">{{ day }}</div>
  </div>

  <!-- 🔹 Calendar Grid -->
  <div class="grid grid-cols-7 text-center text-[10px] sm:text-[12px] bg-[#0a1221]/80 border border-[#0082FB]/20 rounded-b-md overflow-hidden">
    <ng-container *ngFor="let cell of calendarCells">
      <div
        class="relative p-1 sm:p-[6px] min-h-[60px] sm:min-h-[80px] border border-[#1e2f4d] hover:bg-[#001f3f] transition duration-200 cursor-pointer"
        [ngClass]="{
          'bg-[#0082FB] text-white font-bold': isSelectedDate(cell.date),
          'opacity-40 text-[#aaa]': !cell.isCurrentMonth
        }"
        (click)="selectDate(cell.date)"
      >
        <!-- 📅 Day Number -->
        <div class="absolute top-1 left-1 text-xs">{{ cell.date.getDate() }}</div>

        <!-- 📍 Events -->
        <div class="mt-5 flex justify-center gap-1 flex-wrap">
          <!-- Mobile: colored dot -->
          <div *ngFor="let event of getEvents(cell.date)" class="w-2 h-2 rounded-full sm:hidden" [ngClass]="getDotColor(event)"></div>

          <!-- Desktop: event pill -->
          <div *ngFor="let event of getEvents(cell.date)" class="hidden sm:block bg-[#0082FB] text-white text-[9px] px-2 py-[1px] rounded-full truncate shadow">
            {{ event.title }}
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <!-- 🔹 Selected Date Events -->
  <div class="mt-6">
    <h3 class="font-semibold text-[#66b3ff] text-sm mb-3">
      📆 Events on {{ selectedDate | date: 'fullDate' }}
    </h3>

    <div *ngIf="getEvents(selectedDate).length; else noEvents" class="space-y-3">
      <div *ngFor="let event of getEvents(selectedDate)"
           class="bg-[#00152e] border-l-4 rounded-md p-3 shadow-md text-xs sm:text-sm"
           [ngClass]="getCardColor(event)">
        <div class="font-semibold text-[#66b3ff]">{{ event.title }}</div>
        <p class="text-[#ccc] mt-1">{{ event.description }}</p>
      </div>
    </div>

    <ng-template #noEvents>
      <p class="text-[#888] text-xs italic">No events for this day.</p>
    </ng-template>
  </div>
</div>
